name: 'sakila_dw_duckdb'
version: '1.0.0'
config-version: 2

profile: 'sakila_dw_duckdb'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  sakila_dw_duckdb:
    +schema: raw
    +quote_columns: false
    # address.csv has empty address2/phone columns and numeric-looking postal codes,
    # which trip up DuckDB's CSV type sniffer under dbt's default seed loader.
    # Pin explicit column types so the seed loads deterministically; the staging
    # model (stg_address.sql) does the real ::type casting on top of this.
    address:
      +column_types:
        address_id: BIGINT
        address: VARCHAR
        address2: VARCHAR
        district: VARCHAR
        city_id: BIGINT
        postal_code: VARCHAR
        phone: VARCHAR
        last_update: VARCHAR

models:
  sakila_dw_duckdb:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
